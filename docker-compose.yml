services:
  app:
    build: .
    container_name: vip-transfer-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/server/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001

volumes:
  app-data:
  app-uploads:
